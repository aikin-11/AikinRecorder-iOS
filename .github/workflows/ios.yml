name: Build iOS unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build unsigned device app and IPA
        run: bash scripts/build_unsigned.sh
      - name: Publish failure log
        if: failure()
        run: |
          git config user.name Aikin
          git config user.email 0212ac@gmail.com
          cp build/artifacts/device-build.log failure.log || true
          git add -f failure.log
          git commit -m "Record device build log"
          git push origin HEAD:ci-log
      - name: Upload unsigned IPA immediately
        uses: actions/upload-artifact@v4
        with:
          name: AikinRecorder-1.18.0-unsigned-IPA-${{ github.run_number }}
          path: |
            build/artifacts/AikinRecorder-1.18.0-unsigned.ipa
            build/artifacts/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Upload IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AikinRecorder-iOS-${{ github.run_number }}
          path: build/artifacts/
          retention-days: 14
          if-no-files-found: error
